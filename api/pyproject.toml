[project]
name = "cardradar-api"
version = "0.1.0"
description = "FastAPI service for the CardRadar trading card show finder"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "SQLAlchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "python-dateutil>=2.9.0.post0",
    "rapidfuzz>=3.9.0",
    "anthropic>=2.6.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

